<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Kata Kara</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <style>body{font-family:'Segoe UI',sans-serif;}</style>
</head>
<body class="bg-[#f9e7c9] text-[#280b08] min-h-screen flex flex-col">
<div id="header-slot"></div>

<div class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-6">
      <a href="index.html" class="flex items-center justify-center gap-2 mb-4">
        <span class="text-xl font-bold text-[#280B08]">KATA KARA</span>
      </a>
      <h2 class="text-2xl font-bold">Welcome back!</h2>
      <p class="text-sm text-gray-500 mt-1">Login to your account</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-sm font-semibold block mb-1">Email Address</label>
        <input type="email" id="loginEmail" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#280B08]" placeholder="your@email.com"/>
      </div>
      <div>
        <label class="text-sm font-semibold block mb-1">Password</label>
        <div class="relative">
          <input type="password" id="loginPass" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#280B08] pr-12" placeholder="••••••••"/>
          <button type="button" onclick="togglePass('loginPass')" class="absolute right-3 top-3 text-gray-400 hover:text-[#280B08]"><i class="fa fa-eye text-sm"></i></button>
        </div>
      </div>
      <div class="flex justify-end"><a href="#" class="text-sm text-amber-700 hover:underline">Forgot password?</a></div>
      <button onclick="doLogin()" class="bg-[#280B08] hover:bg-[#3d1410] text-white w-full py-3 rounded-xl font-bold text-base transition">Login</button>
      <div class="relative flex items-center"><div class="flex-1 border-t border-gray-200"></div><span class="px-3 text-xs text-gray-400">or</span><div class="flex-1 border-t border-gray-200"></div></div>
      <button class="w-full border border-gray-300 rounded-xl py-3 text-sm font-semibold flex items-center justify-center gap-2 hover:bg-gray-50 transition"><i class="fa-brands fa-google text-red-500"></i> Continue with Google</button>
      <p class="text-center text-sm text-gray-500">Don't have an account? <a href="signup.html" class="text-[#280B08] font-bold hover:underline">Sign up</a></p>
    </div>
  </div>
</div>

<div id="footer-slot"></div>
<script src="shared.js"></script>
<script>
function togglePass(id){ const el=document.getElementById(id); el.type=el.type==='password'?'text':'password'; }
function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  if(!email||!pass){showToast('Please fill in all fields.','error');return;}
  const users=KK.users;
  const u=users[email];
  if(!u||u.pass!==pass){showToast('Incorrect email or password.','error');return;}
  KK.user=u;
  showToast('Welcome back, '+u.name.split(' ')[0]+'!','success');
  const redirect=new URLSearchParams(window.location.search).get('redirect');
  setTimeout(()=>window.location.href=redirect||(u.role==='seller'?'seller-dashboard.html':'buyer-dashboard.html'),700);
}
// Check already logged in
if(KK.user){window.location.href=KK.user.role==='seller'?'seller-dashboard.html':'buyer-dashboard.html';}
</script>
</body>
</html>
