<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart — Kata Kara</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <style>.primary-btn{background:#f2d04e;color:#280b08}.primary-btn:hover{background:#e6c23d}.dark-btn{background:#280b08;color:#f9e7c9}.dark-btn:hover{background:#3d1209}#toast{transition:opacity .3s,transform .3s}</style>
</head>
<body class="bg-[#f9e7c9] text-[#280b08]">
<script src="../js/header.js"></script>

<div class="max-w-5xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6 flex items-center gap-2"><i class="fa fa-shopping-cart text-[#280b08]"></i> My Cart</h1>

  <div id="cartEmpty" class="hidden text-center py-20">
    <i class="fa fa-shopping-cart text-6xl text-gray-300 mb-4 block"></i>
    <p class="text-xl font-semibold text-gray-400">Your cart is empty</p>
    <p class="text-sm text-gray-400 mt-1">Explore products and add them to your cart</p>
    <a href="shop.html" class="inline-block mt-6 primary-btn px-8 py-3 rounded-full font-semibold">Start Shopping</a>
  </div>

  <div id="cartContent" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Items -->
    <div class="lg:col-span-2 space-y-3" id="cartItems"></div>

    <!-- Summary -->
    <div class="lg:col-span-1">
      <div class="bg-gradient-to-r from-white to-amber-100 rounded-xl shadow p-5 sticky top-20">
        <h3 class="font-bold text-lg mb-4">Order Summary</h3>
        <div class="space-y-2 text-sm border-b border-[#280b08]/10 pb-4 mb-4">
          <div class="flex justify-between"><span class="text-gray-500">Subtotal</span><span id="sumSubtotal" class="font-semibold">₦0</span></div>
          <div class="flex justify-between"><span class="text-gray-500">Delivery</span><span id="sumDelivery" class="font-semibold text-green-600">₦0</span></div>
          <div class="flex justify-between"><span class="text-gray-500">Discount</span><span id="sumDiscount" class="font-semibold text-red-500">-₦0</span></div>
        </div>
        <div class="flex justify-between font-bold text-lg mb-4">
          <span>Total</span><span id="sumTotal">₦0</span>
        </div>
        <!-- Coupon -->
        <div class="flex mb-4">
          <input id="couponInput" type="text" placeholder="Coupon code" class="flex-1 border border-[#280b08]/20 rounded-l-lg px-3 py-2 text-sm bg-[#f9e7c9] focus:outline-none"/>
          <button onclick="applyCoupon()" class="dark-btn px-3 rounded-r-lg text-xs font-medium">Apply</button>
        </div>
        <a href="checkout.html" class="dark-btn w-full py-3 rounded-xl font-semibold text-center block text-sm">Proceed to Checkout <i class="fa fa-arrow-right ml-1"></i></a>
        <a href="shop.html" class="block text-center mt-3 text-sm text-blue-600 hover:underline">Continue Shopping</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/footer.js"></script>
<script src="../js/shared.js"></script>
<script>
  function renderCart() {
    const cart = getCart();
    const content = document.getElementById('cartContent');
    const empty = document.getElementById('cartEmpty');
    if(!cart.length) { content.classList.add('hidden'); empty.classList.remove('hidden'); return; }
    content.classList.remove('hidden'); empty.classList.add('hidden');

    document.getElementById('cartItems').innerHTML = cart.map(item=>`
      <div class="bg-white rounded-xl shadow p-4 flex gap-4 items-start">
        <!-- IMAGE instead of icon -->
        <div class="w-20 h-20 bg-[#f9e7c9] rounded-lg flex items-center justify-center flex-shrink-0 overflow-hidden p-1">
          <img src="${item.image}" alt="${item.name}" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/80x80?text=No+Image'">
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="font-semibold text-sm truncate">${item.name}</h4>
          <p class="text-xs text-gray-400 mt-0.5">${item.seller}</p>
          <div class="flex items-center gap-3 mt-2">
            <div class="flex items-center border border-[#280b08]/20 rounded-lg overflow-hidden">
              <button onclick="changeItemQty(${item.id},-1)" class="px-2 py-1 hover:bg-amber-50 text-sm font-bold">-</button>
              <span class="px-3 py-1 text-sm font-semibold border-x border-[#280b08]/20">${item.qty}</span>
              <button onclick="changeItemQty(${item.id},1)" class="px-2 py-1 hover:bg-amber-50 text-sm font-bold">+</button>
            </div>
            <button onclick="removeFromCart(${item.id});renderCart()" class="text-red-400 text-xs hover:text-red-600"><i class="fa fa-trash mr-1"></i>Remove</button>
          </div>
        </div>
        <div class="text-right flex-shrink-0">
          <p class="font-bold text-[#280b08]">₦${(item.price*item.qty).toLocaleString()}</p>
          <p class="text-xs text-gray-400">₦${item.price.toLocaleString()} each</p>
        </div>
      </div>
    `).join('');

    const subtotal = cart.reduce((s,x)=>s+x.price*x.qty,0);
    const delivery = subtotal >= 50000 ? 0 : 2500;
    const discount = 0;
    document.getElementById('sumSubtotal').textContent = '₦'+subtotal.toLocaleString();
    document.getElementById('sumDelivery').textContent = delivery===0 ? 'FREE' : '₦'+delivery.toLocaleString();
    document.getElementById('sumDiscount').textContent = '-₦'+discount.toLocaleString();
    document.getElementById('sumTotal').textContent = '₦'+(subtotal+delivery-discount).toLocaleString();
  }

  function changeItemQty(id, d) { updateQty(id, d); renderCart(); }

  function applyCoupon() {
    const code = document.getElementById('couponInput').value.trim().toUpperCase();
    if(code==='KATAKARA10') showToast('10% discount applied!');
    else showToast('Invalid coupon code.');
  }

  renderCart();
</script>
</body>
</html>
